services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: spdb_mysql
    environment:
      MYSQL_ROOT_PASSWORD: spdb
    ports: ["3306:3306"]
    volumes:
      - mysqldata:/var/lib/mysql
      - ../data/processed:/data:ro
    command: >
      mysqld
      --secure-file-priv=''
      --innodb-buffer-pool-size=2G
      --max-allowed-packet=256M
      --character-set-server=utf8mb4
volumes:
  mysqldata:
