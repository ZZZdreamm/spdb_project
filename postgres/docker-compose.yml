services:
  db:
    image: ${PG_IMAGE:-postgis/postgis:17-3.5}
    container_name: spdb_postgres
    environment:
      POSTGRES_PASSWORD: spdb
      POSTGRES_DB: spdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../data/processed:/data:ro
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c random_page_cost=1.1
volumes:
  pgdata:
